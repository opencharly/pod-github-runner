github-runner:
    candy:
        description: |
            A GitHub Actions self-hosted runner that builds CI jobs rootless inside a disposable box.
            Installs the pinned actions/runner release under ${HOME}/actions-runner
            (config.sh + run.sh, run as uid 1000) plus the CI toolchain — jq/git/go/cosign,
            qemu-user-static for aarch64 binfmt cross-builds, and the rootless nested
            container stack (podman/buildah/skopeo via container-nesting). The .NET runtime
            deps (icu/krb5/openssl/libunwind/lttng-ust) are declared explicitly because the
            runner's installdependencies.sh has no Arch branch — so config.sh actually runs.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            # Rootless nested podman/buildah/skopeo + subuid/subgid layout +
            # newuidmap/newgidmap file-caps + containers/storage/policy configs all
            # come from container-nesting. This layer carries only the
            # runner-specific pieces (R3 — no duplication).
            - '@github.com/opencharly/layer-container-nesting:v2026.271.2309'
        distro:
            arch:
                package:
                    # Runner toolchain (podman/buildah/skopeo/crun/fuse-overlayfs are
                    # provided by container-nesting).
                    - jq
                    - git
                    - go
                    - cloud-guest-utils # growpart
                    - qemu-user-static # aarch64 cross-arch CI (binfmt)
                    - qemu-user-static-binfmt
                    - cosign # repo package (replaces binary download)
                    # POSIX hostname(1) — the ONE utility charly's own test suite needs
                    # from this image and that this image did not have. charly's
                    # venue-materialization tests prove that a peer executed host-locally
                    # by running `hostname` over the venue's shell and comparing it to
                    # os.Hostname(); with no such binary that shell exits 127 and `ci`'s
                    # `go` job fails on EVERY run, which is exactly what reds the gate for
                    # any change at all (charly#806). inetutils is hostname's only Arch
                    # provider — there is no standalone package — and it declares neither
                    # Provides nor Conflicts, so it coexists with iputils' ping. It also
                    # carries logger, tftp, telnet, ftp and rsh.
                    - inetutils
                    # .NET runtime deps for the actions-runner binary — the runner's
                    # bundled installdependencies.sh has no Arch branch, so its native
                    # deps are declared explicitly here. (libz is NOT listed: CachyOS
                    # ships zlib-ng-compat, which Provides zlib/libz.so — an explicit
                    # `zlib` is an unresolvable conflict with it.)
                    - icu
                    - krb5
                    - openssl
                    - libunwind
                    - lttng-ust
                    # charly-host runtime deps that complete the `charly` PKGBUILD `depends=`
                    # set ON THE RUNNER, so the charly CLI (and the CI jobs that drive it)
                    # runs fully here. The rest of depends= is provided by the
                    # charly/virtualization layers.
                    - slirp4netns # rootless podman networking fallback
                    - libisoburn # xorriso — VM NoCloud seed-ISO builder
                    - cdrtools # genisoimage/mkisofs seed-ISO fallback
                    - swtpm # software TPM 2.0 for VM guests
                    # --- CI job tool surface ------------------------------------------
                    # The pool serves the whole org, so a job must find the tools the org's
                    # own workflows actually call. Where a count is given it is MEASURED,
                    # not assumed:
                    #   grep -rhoE '\b<tool>\b' <umbrella>/*/.github/workflows/ | sort | uniq -c
                    # on 2026-10-05. The rest are GitHub-hosted-runner parity and
                    # diagnostics, and are labelled as such rather than dressed up as
                    # demand. What a job needs is a command that exists, so each of these
                    # carries a check in the plan below — an image that merely claims a
                    # tool surface is worth nothing.
                    #
                    # Deliberately NOT here, and not omissions but decisions:
                    #   docker    — 16 refs exist, all `docker run --rm -v …` distro package
                    #               builds in repos that run on hosted runners, plus one
                    #               `uses: docker://`. A podman shim is NOT docker, and
                    #               silently swapping one for the other in CI would trade a
                    #               loud failure for a quiet wrong one (R4). Add real docker
                    #               when a pool job needs it.
                    #   rust/cargo— 6 refs, in two repos not on the pool; a toolchain is
                    #               ~1 GiB. Add it with the repo that needs it.
                    #   jdk, dotnet, gcloud/aws/az — zero refs anywhere in the org.
                    #   passwordless sudo — 8 workflow files use sudo, all in the distro
                    #               repos that build packages on hosted runners. Granting
                    #               NOPASSWD root inside a LONG-LIVED container that runs
                    #               org PRs would widen an escape path for a convenience
                    #               nothing on the pool asks for today.
                    - tree       # 15 refs (action-review, docs, marketplace)
                    - shellcheck # 7 refs (charly-jetkvm, dotgithub)
                    - shfmt      # pairs with shellcheck — the org lints and formats shell
                    - actionlint # 2 refs (action-review); workflow-YAML lint
                    - golangci-lint # 30 refs across 7 repos (charly, sdk, spec, plugin-*);
                                    # the repo's build is v2.13.2 — byte-for-byte the
                                    # version charly's ci `go install`s, so CI and this
                                    # image cannot drift apart on the linter
                    - nodejs     # 12 refs
                    - npm        # 22 refs (docs, pi-asciinema); nodejs does NOT ship npm
                    - python-pip # `pip`/`pip3` were absent although python3 is present
                    - uv         # hosted parity — the current Python resolver/installer
                    - cmake      # hosted parity; gcc/make/autotools are already installed
                    - unzip      # archive handling: setup-* actions, SDK/binary downloads
                    - zip        # ditto, for producing artefacts
                    - 7zip       # .7z archives
                    - wget       # legacy download scripts that never learned curl
                    - rsync      # deploy/upload scripts
                    - yq         # YAML manipulation in job scripts — jq's counterpart
                    - ripgrep    # hosted parity: the search tool jobs and agents reach for
                    - moreutils  # sponge/ts/vipe — pipeline ergonomics
                    - bc         # arithmetic in shell job scripts
                    - less       # pager; git falls back silently without it
                    - lsof       # diagnostics: which process holds that port
                    - strace     # diagnostics: syscall-level failure analysis
                    - openbsd-netcat # nc — network diagnostics (no gnu-netcat present)
                    - bind       # dig/nslookup/host — DNS diagnostics
        volume:
            - name: state
              path: ~/actions-runner
        env:
            RUNNER_WORK_DIR: "${HOME}/actions-runner/_work"
            RUNNER_GROUP: "Default"
            # UTF-8, because this image ships NO generated locale: `locale` reports LANG
            # empty and `locale -a` lists only C, C.utf8 and POSIX. Under the POSIX locale
            # Python 3 and other runtimes fall back to ASCII for the filesystem encoding,
            # so a job that touches a non-ASCII path fails in a way that reads as a bug in
            # the job rather than in the image. GitHub-hosted runners run UTF-8; this is
            # that parity, and C.UTF-8 is built into glibc so nothing needs generating.
            LANG: "C.UTF-8"
            # Deterministic timestamps in job logs, matching hosted runners. tzdata is in
            # the base image, so TZ=UTC resolves.
            TZ: "UTC"
        env_accept:
            - name: RUNNER_ORG
              description: "GitHub org/user to register the runner with (e.g. opencharly). Pass via: charly config githubrunner -e RUNNER_ORG=<org>"
        secret_accept:
            - name: RUNNER_TOKEN
              description: "Short-lived GitHub Actions runner registration token (gh api -X POST /orgs/<org>/actions/runners/registration-token). Credential-store backed; never written to deploy.yml or the quadlet."
        var:
            RUNNER_VERSION: "2.334.0"
        hook:
            # Registration only runs when a token is supplied — so a disposable bed
            # (no token) deploys the image without registering, and a stale token is
            # a clean no-op rather than an error.
            post_enable: |
                [ -z "${RUNNER_TOKEN:-}" ] && { echo "RUNNER_TOKEN empty — skipping runner registration"; exit 0; }
                : "${RUNNER_NAME:=${CHARLY_CONTAINER_NAME:-runner}}"
                : "${RUNNER_LABELS:=opencharly}"
                "${HOME}/actions-runner/config.sh" --unattended \
                  --url "https://github.com/${RUNNER_ORG}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${RUNNER_NAME}" \
                  --labels "${RUNNER_LABELS}" \
                  --replace --work _work
            pre_remove: |
                [ -z "${RUNNER_TOKEN:-}" ] && { echo "RUNNER_TOKEN empty — skipping deregistration"; exit 0; }
                "${HOME}/actions-runner/config.sh" remove \
                  --token "${RUNNER_TOKEN}"
        service:
            - name: github-runner
              exec: "%(ENV_HOME)s/actions-runner/run.sh"
              restart: always
              working_directory: "%(ENV_HOME)s/actions-runner"
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/actions-runner
              mkdir: "${HOME}/actions-runner"
              run_as: "${USER}"
            - run: download=https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz
              download: "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
              extract: tar.gz
              to: "${HOME}/actions-runner"
              run_as: root
            - run: |
                command=rh=$(getent passwd 1000 | cut -d: -f6)
                chown -R 1000:1000 "${rh}/actions-runner"
              run_as: root
              command: |
                rh=$(getent passwd 1000 | cut -d: -f6)
                chown -R 1000:1000 "${rh}/actions-runner"
            - run: mkdir=${HOME}/.config/containers/registries.conf.d
              mkdir: "${HOME}/.config/containers/registries.conf.d"
              run_as: "${USER}"
            - run: write=${HOME}/.config/containers/registries.conf.d/ghcr-mirror.conf
              write: "${HOME}/.config/containers/registries.conf.d/ghcr-mirror.conf"
              run_as: "${USER}"
              mode: "0644"
              content: |
                [[registry]]
                prefix = "ghcr.io"
                location = "ghcr.io"
                [[registry.mirror]]
                location = "127.0.0.1:5000"
                insecure = true
            - check: the GitHub Actions runner is extracted under the home directory with its config.sh present
              file:
                file: "${HOME}/actions-runner/config.sh"
                exists: true
            - check: the runner's run.sh service launcher is present
              file:
                file: "${HOME}/actions-runner/run.sh"
                exists: true
            - check: config.sh executes, proving the .NET native deps (icu/krb5/openssl/libunwind/lttng-ust) resolved on this distro
              exit_status: 0
              command: "${HOME}/actions-runner/config.sh --version"
            - check: skopeo (rootless image copy) reports its version
              exit_status: 0
              command: skopeo --version
            - check: buildah (rootless image build) reports its version
              exit_status: 0
              command: buildah --version
            - check: cosign (image signing) reports its version
              exit_status: 0
              command: cosign version
            - check: the go toolchain used by CI jobs reports its version
              exit_status: 0
              command: go version
            - check: the aarch64 qemu interpreter is installed so jobs can cross-build for arm64 via binfmt
              file:
                file: /usr/bin/qemu-aarch64-static
                exists: true
            - check: the runner service process runs as the unprivileged uid 1000, never root
              stdout:
                - contains: "uid=1000"
              context:
                - runtime
              command: id
            - check: rootless nested podman works inside the box (no mount_too_revealing EPERM)
              exit_status: 0
              context:
                - runtime
              command: podman info
            - check: a CI job can actually pull and run a container image rootless
              exit_status: 0
              context:
                - runtime
              command: "podman run --rm quay.io/libpod/alpine:latest true"
            - check: command=git --version
              id: gr-git
              exit_status: 0
              command: git --version
            - check: package=golang
              id: gr-go-pkg
              package:
                package: golang
                package_map:
                    arch: go
                installed: true
            - check: package=icu
              id: gr-icu-pkg
              package:
                package: icu
                installed: true
            - check: package=slirp4netns
              id: gr-pkgbuild-dep-slirp4netns
              package:
                package: slirp4netns
                installed: true
            - check: package=libisoburn
              id: gr-pkgbuild-dep-libisoburn
              package:
                package: libisoburn
                installed: true
            - check: package=cdrtools
              id: gr-pkgbuild-dep-cdrtools
              package:
                package: cdrtools
                installed: true
            - check: package=swtpm
              id: gr-pkgbuild-dep-swtpm
              package:
                package: swtpm
                installed: true
            - check: file=${HOME}/.config/containers/registries.conf.d/ghcr-mirror.conf
              id: gr-ghcr-mirror
              context:
                - runtime
              file:
                file: "${HOME}/.config/containers/registries.conf.d/ghcr-mirror.conf"
                exists: true
            - check: command=getcap /usr/bin/newuidmap
              id: gr-newuidmap-cap
              stdout:
                - contains: cap_setuid
              context:
                - runtime
              command: getcap /usr/bin/newuidmap
            # --- CI job tool surface ---------------------------------------------------
            # Behavioural, not merely declared: `hostname` is the command charly's
            # venue-materialization tests actually execute over a peer's shell, so this
            # check fails on precisely the defect it was added to fix.
            - check: hostname(1) resolves on PATH, so charly's venue tests can prove a peer ran host-locally
              id: gr-hostname
              exit_status: 0
              command: hostname
            - check: package=inetutils
              id: gr-inetutils-pkg
              package:
                package: inetutils
                installed: true
            # One package check per tool, so a failure names the missing tool instead of a
            # generic "the tool surface is broken". `package:` proves presence at build
            # time; a tool that is declared but not installed fails the build here.
            - check: package=tree
              id: gr-ci-tree
              package:
                package: tree
                installed: true
            - check: package=shellcheck
              id: gr-ci-shellcheck
              package:
                package: shellcheck
                installed: true
            - check: package=shfmt
              id: gr-ci-shfmt
              package:
                package: shfmt
                installed: true
            - check: package=actionlint
              id: gr-ci-actionlint
              package:
                package: actionlint
                installed: true
            - check: package=golangci-lint
              id: gr-ci-golangci-lint
              package:
                package: golangci-lint
                installed: true
            - check: package=nodejs
              id: gr-ci-nodejs
              package:
                package: nodejs
                installed: true
            - check: package=npm
              id: gr-ci-npm
              package:
                package: npm
                installed: true
            - check: package=python-pip
              id: gr-ci-python-pip
              package:
                package: python-pip
                installed: true
            - check: package=uv
              id: gr-ci-uv
              package:
                package: uv
                installed: true
            - check: package=cmake
              id: gr-ci-cmake
              package:
                package: cmake
                installed: true
            - check: package=unzip
              id: gr-ci-unzip
              package:
                package: unzip
                installed: true
            - check: package=zip
              id: gr-ci-zip
              package:
                package: zip
                installed: true
            - check: package=7zip
              id: gr-ci-7zip
              package:
                package: 7zip
                installed: true
            - check: package=wget
              id: gr-ci-wget
              package:
                package: wget
                installed: true
            - check: package=rsync
              id: gr-ci-rsync
              package:
                package: rsync
                installed: true
            - check: package=yq
              id: gr-ci-yq
              package:
                package: yq
                installed: true
            - check: package=ripgrep
              id: gr-ci-ripgrep
              package:
                package: ripgrep
                installed: true
            - check: package=moreutils
              id: gr-ci-moreutils
              package:
                package: moreutils
                installed: true
            - check: package=bc
              id: gr-ci-bc
              package:
                package: bc
                installed: true
            - check: package=less
              id: gr-ci-less
              package:
                package: less
                installed: true
            - check: package=lsof
              id: gr-ci-lsof
              package:
                package: lsof
                installed: true
            - check: package=strace
              id: gr-ci-strace
              package:
                package: strace
                installed: true
            - check: package=openbsd-netcat
              id: gr-ci-openbsd-netcat
              package:
                package: openbsd-netcat
                installed: true
            - check: package=bind
              id: gr-ci-bind
              package:
                package: bind
                installed: true
            # The locale is a runtime property of the deployed container, not a package, so
            # it is asserted where it actually applies: the env the job inherits.
            # `locale charmap` is the assertion that can actually fail: before this
            # change the deployed container reported ANSI_X3.4-1968 (ASCII), and it reports
            # UTF-8 only once LANG is set — so this check proves the locale change rather
            # than restating a coincidence of the base image.
            - check: the container runs with a UTF-8 locale, so jobs never fall back to ASCII filesystem encoding
              id: gr-ci-utf8-locale
              stdout:
                - contains: "UTF-8"
              context:
                - runtime
              command: locale charmap
            # NOTE: `date +%Z` is deliberately NOT the assertion here. The container's
            # /etc/localtime is already UTC, so `date +%Z` prints UTC with TZ unset and the
            # check could never fail — a gate that cannot fail proves nothing. Asserting the
            # variable itself does fail when the env entry is removed.
            - check: TZ is set explicitly, so job-log timestamps do not depend on the base image's /etc/localtime
              id: gr-ci-tz-utc
              stdout:
                - contains: "UTC"
              context:
                - runtime
              command: printenv TZ

github-runner-skill:
    skill:
        name: github-runner
        family: distros
        owner: github-runner
        description: |-
            GitHub Actions self-hosted runner as a supervised container service — rootless
            (uid 1000), Arch/CachyOS packages, credential-backed registration token.
            Use when working with GitHub Actions runners, CI/CD infrastructure, or runner registration.
        content: |
            # github-runner -- GitHub Actions self-hosted runner
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Dependencies | `supervisord`, `container-nesting` |
            | Volume | `state` -> `${HOME}/actions-runner` |
            | Service | `github-runner` (supervisord; runs `run.sh` as uid 1000) |
            | Security | none of its own — rootless nested podman comes from `container-nesting` (no `privileged`) |
            | Install files | `task:` — declarative pinned `download:` of the runner tarball + `write:` of the ghcr mirror config; the runner tree is root-extracted (the shared download cache is root-owned) then `chown -R`ed to uid 1000 (the one ownership `cmd:`) |
            
            ## Packages (`distro.arch`, all in the official core/extra repos)
            
            - Toolchain: `jq`, `git`, `go`, `cloud-guest-utils`, `cosign`, `inetutils`
              (`inetutils` is `hostname(1)`'s only Arch provider — charly's own venue tests
              run `hostname` to prove a peer executed host-locally, and without the binary
              they fail with exit 127; see **CI job tool surface** below)
            - Cross-arch CI: `qemu-user-static`, `qemu-user-static-binfmt` (aarch64 binfmt)
            - .NET runtime deps for the runner binary (its `installdependencies.sh` has no
              Arch branch): `icu`, `krb5`, `openssl`, `libunwind`, `lttng-ust` (NOT `zlib` —
              CachyOS ships `zlib-ng-compat`, which Provides it; an explicit `zlib` conflicts)
            - charly-host `depends=` completion: `slirp4netns`, `libisoburn`, `cdrtools`, `swtpm`
              — the part of the charly package's `depends=` set (`packaging.formats.archlinux.depends`
              in the charly candy) the charly/virtualization candies do not already install, so the
              charly CLI (and the CI jobs that drive it) runs fully on the runner. (The legacy
              `charly box pkg` release-packages build that ran here is removed with the nFPM
              cutover — the `charly generate-packages` plugin + the per-distro repos build the
              packages now.)
            
            - **CI job tool surface** — the pool is org-wide, so a job must find whatever the
              org's workflows actually call. Every entry below carries a `package:` check in
              the candy's own `plan:`, so a tool that is declared but not installed fails the
              image build rather than a job at 02:00: `tree`, `shellcheck`, `shfmt`,
              `actionlint`, `golangci-lint` (the packaged `v2.13.2` is byte-for-byte the
              version charly's own `ci` installs, so CI and the image cannot drift apart on
              the linter), `nodejs`, `npm`, `python-pip`, `uv`, `cmake`, `unzip`, `zip`,
              `7zip`, `wget`, `rsync`, `yq`, `ripgrep`, `moreutils`, `bc`, `less`, `lsof`,
              `strace`, `openbsd-netcat`, `bind`.
              Deliberately **absent**, as decisions rather than omissions: `docker` (16 refs
              exist, all `docker run --rm -v …` distro package builds on hosted runners — a
              podman shim is not docker, and quietly swapping the two in CI trades a loud
              failure for a silent wrong one, R4); `rust`/`cargo` (6 refs, in repos not on the
              pool); a JDK and the cloud CLIs (zero refs org-wide); and passwordless `sudo`
              (8 workflow files use `sudo`, all in distro repos building packages on hosted
              runners — NOPASSWD root inside a long-lived container that runs org PRs would
              widen an escape path for a convenience nothing on the pool asks for).

            `podman`/`buildah`/`skopeo`/`crun`/`fuse-overlayfs` are provided by the
            `container-nesting` dependency (not redeclared here — R3).
            
            ## Environment / token contract
            
            | Variable | Mechanism |
            |----------|-----------|
            | `RUNNER_ORG` | `env_accept` (plaintext identifier; supplied at deploy) |
            | `RUNNER_TOKEN` | `secret_accept` (credential-store-backed; never in charly.yml/quadlet) |
            | `RUNNER_WORK_DIR` | `${HOME}/actions-runner/_work` |
            | `RUNNER_GROUP` | `Default` |
            | `LANG` | `C.UTF-8` (fixed) — see **Locale** below |
            | `TZ` | `UTC` (fixed) — deterministic log timestamps |

            **Locale.** The base image generates none: with `LANG` unset, `locale charmap`
            reports `ANSI_X3.4-1968` (ASCII), so Python and other runtimes fall back to ASCII
            for the filesystem encoding and a job that touches a non-ASCII path fails in a way
            that reads as a bug in the job. `LANG=C.UTF-8` is set in the candy's `env:`; glibc
            has `C.UTF-8` built in, so no locale needs generating. The `plan:` asserts it with
            `locale charmap` — an assertion that genuinely fails without the change. Note that
            the `TZ` check asserts the *variable* (`printenv TZ`), not `date +%Z`: the image's
            `/etc/localtime` is already UTC, so `date +%Z` would pass either way and prove
            nothing.


            The runner installs under `${HOME}/actions-runner` and runs as uid 1000. The
            ghcr.io pull-through mirror (`127.0.0.1:5000`) config is written to the user
            location `${HOME}/.config/containers/registries.conf.d/` (rootless podman).
            
            ## Lifecycle Hooks (token-guarded)
            
            - **post_enable** — registers the runner with `RUNNER_ORG` + `RUNNER_TOKEN`.
              Skips (no-op) when `RUNNER_TOKEN` is empty — so a token-less deploy (an check
              bed) brings the image up without registering.
            - **pre_remove** — deregisters; needs a **remove**-token (distinct from the
              registration token). Also skips when the token is empty.
            
            ## Usage
            
            ```yaml
            # charly.yml — rootless, CachyOS
            githubrunner:
              base: cachyos.cachyos
              build: [pac]
              candy: [agent-forwarding, github-runner, charly, dbus, container-nesting]
              network: host          # no uid/privileged override → rootless
            ```
            
            ```bash
            TOKEN=$(gh api -X POST /orgs/myorg/actions/runners/registration-token --jq .token)
            charly config githubrunner -e RUNNER_ORG=myorg -e RUNNER_TOKEN="$TOKEN"
            charly remove githubrunner -e RUNNER_TOKEN=$(gh api -X POST /orgs/myorg/actions/runners/remove-token --jq .token)
            ```
            
            ## Org-runner routing: a queued job is almost never an agent problem
            
            A job that shows `labels: ["<your-label>"]`, `status: queued`, `runner_name: ""`
            while the runner reads `online` + `busy: false` is a ROUTING failure, not a
            runner failure — the runner has nothing to execute. Work the causes in order:
            
            1. **The runner group does not allow public repos (the silent one).** An org
               runner in a group whose `allows_public_repositories` is `false` is INVISIBLE
               to every public repo in the org, so their jobs queue forever with no error
               anywhere. Check and fix with a REAL boolean (the `-f` flag sends the string
               `"true"`, which the API rejects as `"true" is not a boolean` — use `--input`):
            
               ```bash
               gh api /orgs/<org>/actions/runner-groups --jq '.runner_groups[]|{id,name,allows_public_repositories,visibility}'
               echo '{"allows_public_repositories": true}' > rg.json
               gh api -X PATCH /orgs/<org>/actions/runner-groups/<id> --input rg.json
               ```
            
            2. **`labels` mismatch.** The runner must carry every label `runs-on` names.
               Compare `gh api /orgs/<org>/actions/runners --jq '.runners[0].labels'` against
               the job's `labels` (a reusable workflow may resolve a `vars.` label you forgot
               to set, e.g. `vars.REVIEW_RUNNER_LABEL`).
            
            3. **A stale broker session.** After a container restart the listener can log
               `A session for this runner already exists` / `TaskAgentSessionConflictException`
               and retry on a 30s loop without taking jobs, while still reporting `online`.
               A full clean cycle clears it — `charly remove` (deregisters) then
               `charly config` + `charly start` — not just a restart.
            
            Confirm the fix by watching the job, not the runner: a picked-up job flips to
            `in_progress` with `runner_name` set, and the workflow's steps then appear.

            ## `gh` must be present for a review/gate runner

            A runner whose job is to execute `gh`-driven workflows (the org `pr-validator`
            runs `gh api` / `gh pr comment` / `gh pr merge`) needs the `gh` CLI in its
            image — compose `/charly-tools:gh` (it is not part of the base toolchain). A
            runner without it fails the workflow at its first `gh` call.
            
